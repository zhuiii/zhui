<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>饮水记录</title>
    <meta name="description" content="在电脑上记录今天喝了多少水，对照每日计划，并在到点时提醒你喝水。" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23155e73'/%3E%3Cpath d='M10 8h12l-1.5 13.6A4.2 4.2 0 0 1 16.3 26h-.6a4.2 4.2 0 0 1-4.2-4.4z' fill='%23dff6f8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <main class="desk">
        <header class="titlebar">
          <div>
            <p class="eyebrow">桌面小应用</p>
            <h1>饮水记录</h1>
          </div>
          <p class="clock" id="clock">上海时间</p>
        </header>

        <div id="banner" class="banner" hidden>
          <p id="banner-text" role="status"><strong>该喝水了。</strong>休息一下，喝一杯水。</p>
          <button type="button" class="btn light" id="banner-dismiss">知道了</button>
        </div>

        <div class="layout">
          <section class="side" aria-label="今日进度与提醒">
            <div class="summary">
            <div class="vessel">
              <svg class="glass" viewBox="0 0 200 244" aria-hidden="true">
                <defs>
                  <linearGradient id="waterFill" x1="0" x2="0" y1="1" y2="0">
                    <stop offset="0%" stop-color="#13566c" />
                    <stop offset="52%" stop-color="#2f8ea6" />
                    <stop offset="100%" stop-color="#d7f6f8" />
                  </linearGradient>
                  <clipPath id="glassClip">
                    <path d="M62 34h76L124 206a26 26 0 0 1-48 0L62 34z" />
                  </clipPath>
                </defs>
                <ellipse cx="100" cy="230" rx="48" ry="7" fill="rgba(28, 60, 70, 0.08)" />
                <g clip-path="url(#glassClip)">
                  <rect id="water" x="50" y="220" width="100" height="0" fill="url(#waterFill)" />
                  <ellipse id="surface" cx="100" cy="220" rx="18" ry="5.5" fill="#f3fdff" opacity="0" />
                </g>
                <path d="M62 34h76L124 206a26 26 0 0 1-48 0L62 34z" fill="rgba(255,255,255,0.2)" stroke="#7ea8b3" stroke-width="2.5" />
                <path d="M76 46c2 18 2 32 0 52" fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="4" stroke-linecap="round" />
              </svg>
            </div>

            <div class="readout" id="readout">
              <p class="total" id="total">0</p>
              <p class="total-label">今日已喝（毫升）</p>
              <p class="percent" id="percent">完成 0%</p>
              <p class="remain" id="remain">还差 2,000 毫升</p>
              <p class="extra" id="extra" hidden></p>
              <p class="glass-caption" id="glass-caption">杯子还是空的</p>
              <p class="goal-flag" id="goal-flag" hidden>今日目标已达成</p>
            </div>
            </div>

            <form id="plan-form" class="card" novalidate>
              <div class="card-head">
                <h2>每日计划</h2>
              </div>
              <div class="plan-row">
                <label class="field">
                  <span>目标饮水量（毫升）</span>
                  <input id="target" name="target" type="number" inputmode="numeric" min="100" max="10000" step="1" required />
                </label>
                <button type="submit" class="btn primary">保存计划</button>
              </div>
              <p class="hint error" id="plan-error" role="alert"></p>
              <p class="hint ok" id="plan-msg" role="status"></p>
            </form>

            <section class="card" aria-labelledby="reminder-title">
              <div class="card-head">
                <h2 id="reminder-title">喝水提醒</h2>
                <button type="button" id="reminder-toggle" class="switch" role="switch" aria-checked="false">
                  <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
                  <span id="reminder-toggle-text">已关闭</span>
                </button>
              </div>
              <label class="field">
                <span>间隔（分钟）</span>
                <input id="interval" type="number" inputmode="numeric" min="1" max="240" step="1" />
              </label>
              <div class="presets" role="group" aria-label="常用间隔">
                <button type="button" data-interval="30">30</button>
                <button type="button" data-interval="45">45</button>
                <button type="button" data-interval="60">60</button>
                <button type="button" data-interval="90">90</button>
              </div>
              <p class="countdown is-idle" id="countdown">--:--:--</p>
              <p class="hint" id="next-label">打开开关后开始倒计时。</p>
              <p class="hint" id="notify-status"></p>
              <p class="hint error" id="reminder-error" role="alert"></p>
            </section>
          </section>

          <section class="main" aria-label="记录饮水">
            <form id="log-form" novalidate>
              <div class="section-head">
                <h2>记一杯</h2>
                <p>时间默认是现在，可以改到今天更早的时刻。</p>
              </div>
              <div class="quick" id="quick-add" role="group" aria-label="常用分量">
                <button type="button" data-ml="150"><strong>150</strong><span>毫升</span></button>
                <button type="button" data-ml="250"><strong>250</strong><span>毫升</span></button>
                <button type="button" data-ml="350"><strong>350</strong><span>毫升</span></button>
                <button type="button" data-ml="500"><strong>500</strong><span>毫升</span></button>
              </div>
              <div class="form-grid">
                <label class="field">
                  <span>自定义毫升</span>
                  <input id="amount" name="amount" type="number" inputmode="numeric" min="1" max="3000" step="1" required />
                </label>
                <label class="field">
                  <span>时间（上海）</span>
                  <input id="when" name="when" type="datetime-local" step="60" required />
                </label>
              </div>
              <div class="actions">
                <button type="submit" class="btn primary">记下这一杯</button>
                <button type="button" class="btn ghost" id="use-now">改为现在</button>
              </div>
              <p class="hint error" id="form-error" role="alert"></p>
              <p class="toast" id="toast" role="status"></p>
            </form>

            <div class="ledger">
              <div class="section-head split">
                <h2>今日记录</h2>
                <p class="count-pill" id="log-count">0 杯</p>
              </div>
              <div id="log-list" class="log-list"></div>
            </div>
          </section>
        </div>

        <footer class="foot">数据只保存在这台浏览器里。今日从上海时间 0 点起算。</footer>
      </main>
    </div>
    <noscript>
      <p class="noscript">请启用 JavaScript 后再使用饮水记录。</p>
    </noscript>
    <script src="logic.js"></script>
    <script src="app.js"></script>
  </body>
</html>
